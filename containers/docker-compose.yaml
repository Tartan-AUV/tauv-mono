version: '3.4'

services:
  tauv-desktop:
    image: ghcr.io/tartan-auv/desktop_nogpu_user:latest
    network_mode: "host"
    privileged: true
    # NOTE (green): runtime + NVIDIA env vars below are specific to green's local machine
    # (NVIDIA GPU). Remove these if running on a machine without an NVIDIA GPU.
    # runtime: nvidia
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined

    volumes:
      - ../:/tauv-mono

      # Atharv's SSD Mount
      - /mnt/hgfs/peely:/mnt/peely

      - ${HOME}/.config/nvim:/root/.config/nvim:Z
      - ${HOME}/.tmux.conf:/root/.tmux.conf:Z
      - ${HOME}/.codex:/root/.codex:Z

      # SSH agent
      - ~/.ssh/ssh_auth_sock:/ssh-agent

      # X11 (fallback / legacy)
      - /tmp/.X11-unix:/tmp/.X11-unix:ro

      # Wayland: mount the whole runtime dir
      # NOTE: UID must match your host user (see the .env section below)
      - /run/user/${UID}:/run/user/${UID}

      # (Recommended) DBus session so portals + some toolkits work better on Wayland
      - /run/user/${UID}/bus:/run/user/${UID}/bus

    environment:
      - SSH_AUTH_SOCK=/ssh-agent
      # NOTE (green): specific to green's local machine, remove if no NVIDIA GPU
      # - NVIDIA_VISIBLE_DEVICES=all
      # - NVIDIA_DRIVER_CAPABILITIES=all

      # X11
      - DISPLAY=${DISPLAY:-:0}

      # Wayland
      - WAYLAND_DISPLAY=${WAYLAND_DISPLAY:-wayland-0}
      - XDG_RUNTIME_DIR=/run/user/${UID}

      # Optional: help toolkits pick the right backend when both are available
      - QT_QPA_PLATFORM=wayland;xcb
      - GDK_BACKEND=wayland,x11
      - SDL_VIDEODRIVER=wayland,x11

      # DBus session (matches the mounted socket above)
      - DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/${UID}/bus

    devices:
      - /dev:/dev

    command: /bin/sh -c "while sleep 1000; do :; done"


  osprey-orin-user:
    image: ghcr.io/tartan-auv/osprey_orin_user:latest
    network_mode: "host"
    privileged: true
    runtime: nvidia
    working_dir: /tauv-mono/ros_ws
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
    devices:
      - /dev:/dev
    volumes:
      - /home/tauv/tauv-mono:/tauv-mono
      - /home/tauv/data:/data
      - /home/tauv/.bash_history:/root/.bash_history
    command: /bin/sh -c "grep -qxF 'source /tauv-mono/ros_ws/install/setup.bash' ~/.bashrc || echo 'source /tauv-mono/ros_ws/install/setup.bash' >> ~/.bashrc && sleep infinity"
