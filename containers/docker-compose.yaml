version: '3.4'

services:
  tauv-desktop:
    image: ghcr.io/tartan-auv/desktop_nogpu:latest
    network_mode: "host"
    privileged: true
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined   
    volumes:
      - ../packages:/ros_ws/src
      - ../.ros_build:/ros_ws/build
      - ../.ros_install:/ros_ws/install
      - ../.ros_log:/ros_ws/log
    devices:
      - /dev:/dev
    command: /bin/sh -c "while sleep 1000; do :; done"
