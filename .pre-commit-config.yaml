repos:
  - repo: local
    hooks:
      - id: clang-format
        name: C/C++ clang-format (Google)
        entry: clang-format
        args: ["-i"]
        language: system
        types_or: [c, c++]
        files: \.(c|cc|cpp|cxx|h|hh|hpp|hxx)$
        exclude: ^firmware/

      - id: clang-tidy
        name: C/C++ clang-tidy
        entry: clang-tidy
        args: ["-quiet", "-p", "/tauv-mono/ros_ws/build"]
        language: system
        types_or: [c, c++]
        files: \.(c|cc|cpp|cxx|h|hh|hpp|hxx)$
        exclude: ^firmware/

      - id: ruff-format
        name: Python ruff format
        entry: ruff
        args: ["format", "--force-exclude"]
        language: system
        types: [python]
        files: \.(py)$
        exclude: ^firmware/

      - id: ruff-lint
        name: Python ruff lint
        entry: ruff
        args: ["check", "--fix", "--exit-non-zero-on-fix", "--force-exclude"]
        language: system
        types: [python]
        files: \.(py)$
        exclude: ^firmware/

      - id: pyright
        name: Python pyright (type check)
        entry: pyright
        language: system
        types: [python]
        files: \.(py)$
        exclude: ^firmware/

# Default to running on commit; users can run on-demand with --all-files if desired
default_stages: [commit]
