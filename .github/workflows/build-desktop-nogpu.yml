name: CI - Build desktop_nogpu

on:
  pull_request:
    branches:
      - develop
    paths:
      - containers/**

jobs:
  build-desktop-nogpu:
    name: Build desktop_nogpu (amd64)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure SSH agent for BuildKit
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: |
            ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image (linux/amd64) and load locally
        working-directory: containers
        env:
          IMAGE: ghcr.io/tartan-auv/desktop_nogpu
          SHA: ${{ github.sha }}

        # Note: we override cache setting cuz the GH runner disk is too small to keep local cache
        run: |
          docker buildx bake \
            --allow=ssh \
            -f docker-bake.hcl \
            --set desktop_nogpu.platform=linux/amd64 \
            --set desktop_nogpu.tags=${IMAGE}:${SHA}-amd64 \
            desktop_nogpu_ci

      - name: Test colcon build (sim) in container
        env:
          IMAGE: ghcr.io/tartan-auv/desktop_nogpu
          SHA: ${{ github.sha }}
        run: |
          mkdir -p .ros_build .ros_install .ros_log
          docker run --rm \
            -v ${{ github.workspace }}:/tauv-mono \
            ${IMAGE}:${SHA}-amd64 \
            bash -lc "cd /tauv-mono/ros_ws; source /opt/ros/jazzy/setup.bash; colcon build --event-handlers console_direct+"

      - name: Run pre-commit (format-only) inside container
        env:
          IMAGE: ghcr.io/tartan-auv/desktop_nogpu
          SHA: ${{ github.sha }}
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/tauv-mono \
            ${IMAGE}:${SHA}-amd64 \
            bash -lc "set -euo pipefail; \
              cd /tauv-mono; \
              pre-commit run -a clang-format; \
              pre-commit run -a ruff-format"
